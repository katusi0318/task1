<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splatoon: Turf War AI Battle</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --player-color: #00ff66;
      --ai-color: #ff0055;
      --text-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    h1 {
      color: var(--player-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--player-color);
      margin-bottom: 5px;
      font-size: 26px;
    }

    .subtitle {
      color: var(--ai-color);
      font-size: 14px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--player-color);
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      margin-bottom: 15px;
      box-sizing: border-box;
      text-align: center;
    }

    canvas {
      background-color: #222;
      border: 3px solid #444;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none;
      display: block;
      margin: 0 auto;
    }

    button {
      width: 100%;
      background: linear-gradient(45deg, var(--player-color), #00b349);
      border: none;
      color: #000;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .btn-secondary {
      background: #333;
      color: #fff;
      border: 1px solid var(--player-color);
    }

    .btn-danger {
      background: #ff4444;
      color: #fff;
    }

    .status-box {
      display: flex;
      justify-content: space-around;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .status-item {
      text-align: center;
    }

    .status-value {
      font-size: 18px;
      font-weight: bold;
    }

    .player-text { color: var(--player-color); }
    .ai-text { color: var(--ai-color); }

    #timer-val {
      font-size: 24px;
      color: #ffcc00;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--player-color);
      background: #111;
      color: white;
      box-sizing: border-box;
      text-align: center;
    }

    ol {
      padding-left: 20px;
      text-align: left;
    }

    li {
      margin-bottom: 6px;
      color: #ddd;
    }

    #loading {
      color: var(--player-color);
      font-size: 16px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h1>SPLAT-TURF: AI BATTLE</h1>
  <div class="subtitle">〜 VS ライバルAI 塗り返しバトル！ 〜</div>

  <div id="loading">通信中...</div>

  <!-- ログイン画面 -->
  <div id="login-section" class="card" style="display: none;">
    <h2>Googleログイン</h2>
    <p>AI対戦で勝利を重ねてクラウドのランキングに名を刻め！</p>
    <button id="btn-login">Googleでログインして対戦</button>
  </div>

  <!-- メインゲーム画面 -->
  <div id="game-section" class="card" style="display: none;">
    <div id="user-display"></div>

    <div id="timer-box" style="margin-bottom: 10px;">
      残り時間: <span id="timer-val">30</span>秒
    </div>

    <div class="status-box">
      <div class="status-item">
        <div class="player-text">YOU (緑)</div>
        <div id="player-score" class="status-value player-text">0 pt</div>
      </div>
      <div class="status-item">
        <div class="ai-text">AI (赤)</div>
        <div id="ai-score" class="status-value ai-text">0 pt</div>
      </div>
      <div class="status-item">
        <div>勝利数</div>
        <div id="wins-val" class="status-value" style="color: #00ffcc;">0 勝利</div>
      </div>
    </div>

    <canvas id="paintCanvas" width="350" height="280"></canvas>

    <button id="btn-start">バトルスタート！</button>

    <h3>📝 プレイヤー名設定（加点要素）</h3>
    <input type="text" id="player-name-input" placeholder="イカのなまえ">
    <button id="btn-update-name" class="btn-secondary">名前を変更する</button>

    <br><br>
    <button id="btn-reset" class="btn-danger">全データを初期化</button>
    <button id="btn-logout" class="btn-secondary">ログアウト</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-section" class="card" style="display: none;">
    <h3>🏆 全国対AI勝利数ランキング</h3>
    <ol id="ranking-list"></ol>
  </div>
